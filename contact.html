<body>
    <div class="navigation_container">
        <a href="index.html">
            <button class="nav">

        </div>
    <div class="container">
            <form>
                <table id="table">
                    <tr>
                        <td>Full Name:</td>
                        <td>
                            <input type="text" placeholder="Enter Your Name" required>
                        </td>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td>
                            <input type="email" placeholder="Enter Your Email" required>
                        </td>
                    </tr>
                    <tr>
                        <td>Message:</td>
                        <td>
                            <textarea name="Message" rows="5" cols="30" placeholder="Type Your Message"
                                required></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <button type="submit" class="btn" onclick="showAlert()">Send Message</button>
                        </td>
                    </tr>
                </table>
            </form>
    </div>
</body>
<script>
    function showAlert() {
    alert("Your message has been recorded.");
    }
</script>
